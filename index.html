<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>はらぴ 大人のペーパードール 着せ替え</title>
<style>
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    text-align: center;
    background-color: #fcf9f2;
    margin: 0; padding: 20px;
  }
  h1 { color: #5a5a5a; margin-bottom: 30px; }
  
  .app-container {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 30px;
    max-width: 1200px;
    margin: 0 auto;
  }
  
  .control-area {
    flex: 1;
    max-width: 350px;
    background: #ffffff;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.05);
    text-align: left;
  }
  .category { margin-bottom: 25px; }
  .category h3 { 
    margin: 0 0 15px 0; 
    font-size: 16px; 
    color: #4a4a4a;
    border-bottom: 2px dashed #a3d9a5; 
    padding-bottom: 5px; 
  }

  .item-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    gap: 10px;
  }

  .btn-item {
    width: 100%;
    aspect-ratio: 1 / 1;
    background-color: #f5f5f5;
    border: 2px solid #e0e0e0;
    border-radius: 10px;
    cursor: pointer;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: all 0.2s;
    padding: 0;
  }
  .btn-item:hover {
    border-color: #a3d9a5;
    background-color: #eaf5eb;
  }
  
  .btn-clear {
    font-size: 13px;
    font-weight: bold;
    color: #d9534f;
    background-color: #ffe6e6;
    border-color: #ffb3b3;
  }
  .btn-clear:hover { background-color: #ffcccc; }

  /* --- サムネイルのスポットライト調整（修正版） --- */
  .btn-item img.thumb {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  
  .thumb-onepiece { transform: scale(1.3); transform-origin: center 50%; }
  .thumb-top      { transform: scale(2.0); transform-origin: center 25%; }
  .thumb-bottom   { transform: scale(2.2); transform-origin: center 65%; }
  .thumb-hat      { transform: scale(3.5); transform-origin: center 5%; } 
  .thumb-shoes    { transform: scale(4.0); transform-origin: center 95%; } 
  
  /* ↓修正箇所：カメラを少し引いて、左右両方が写るようにしました！ */
  .thumb-acs      { transform: scale(1.8); transform-origin: center 15%; } 
  .thumb-bag      { transform: scale(1.6); transform-origin: center 55%; } 
  /* --------------------------------------------------------------- */

  .preview-area {
    position: relative;
    width: 400px;
    height: 600px;
    background-color: #ffffff;
    border: 3px solid #e0d5c1;
    border-radius: 15px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.1);
    overflow: hidden;
    flex-shrink: 0;
  }
  .preview-area img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain;
  }

  #layer-base     { z-index: 10; }
  #layer-shoes    { z-index: 20; }
  #layer-bottom   { z-index: 30; }
  #layer-top      { z-index: 40; }
  #layer-onepiece { z-index: 50; }
  #layer-bag      { z-index: 60; }
  #layer-acs      { z-index: 70; }
  #layer-hat      { z-index: 80; }
/* --- スマホ対応（レスポンシブ化）のための魔法のルール --- */
  @media (max-width: 900px) {
    .app-container {
      flex-direction: column; /* 横並びを縦並びに変更 */
      align-items: center;    /* 中央揃え */
    }
    
    .control-area {
      width: 100%;            /* 横幅を画面いっぱいに */
      max-width: 400px;       /* プレビュー画面と同じ最大幅に制限 */
      box-sizing: border-box; /* 余白のはみ出し防止 */
    }
    
    .preview-area {
      width: 100%;            /* スマホの画面幅に合わせる */
      max-width: 400px;
      /* 高さは横幅に合わせて自動縮小（アスペクト比固定） */
      height: auto;           
      aspect-ratio: 400 / 600; 
      order: -1;              /* プレビュー（ドール）を一番上に表示！ */
    }
    
    h1 {
      font-size: 20px;        /* スマホ向けにタイトルの文字を少し小さく */
    }
  }
</style>
</head>
<body>

<h1>はらぴ 大人のペーパードール（プロトタイプv3 完成版）</h1>

<div class="app-container">
  <!-- 左クローゼット -->
  <div class="control-area" id="controls-left"></div>

  <!-- 中央プレビュー -->
  <div class="preview-area">
    <img id="layer-base" src="base.png" alt="本体">
    <img id="layer-shoes" src="" style="display:none;">
    <img id="layer-bottom" src="" style="display:none;">
    <img id="layer-top" src="" style="display:none;">
    <img id="layer-onepiece" src="" style="display:none;">
    <img id="layer-bag" src="" style="display:none;">
    <img id="layer-acs" src="" style="display:none;">
    <img id="layer-hat" src="" style="display:none;">
  </div>

  <!-- 右クローゼット -->
  <div class="control-area" id="controls-right"></div>
</div>

<script>
  const items = {
    onepiece: { name: '👗 ワンピース', count: 4, prefix: 'onepiece_', side: 'left' },
    top:      { name: '👕 トップス', count: 8, prefix: 'top_', side: 'left' },
    bottom:   { name: '👖 ボトムス', count: 8, prefix: 'bottom_', side: 'left' },
    hat:      { name: '👒 帽子', count: 2, prefix: 'hat_', side: 'right' },
    acs:      { name: '✨ アクセサリー', count: 2, prefix: 'acs_', side: 'right' },
    bag:      { name: '👜 バッグ', count: 10, prefix: 'bag_', side: 'right' },
    shoes:    { name: '🧦 靴下・靴', count: 10, prefix: 'shoes_', side: 'right' }
  };

  for (const [categoryKey, data] of Object.entries(items)) {
    const targetDiv = document.getElementById(`controls-${data.side}`);
    const catDiv = document.createElement('div');
    catDiv.className = 'category';
    
    const title = document.createElement('h3');
    title.textContent = data.name;
    catDiv.appendChild(title);

    const gridDiv = document.createElement('div');
    gridDiv.className = 'item-grid';

    const clearBtn = document.createElement('button');
    clearBtn.className = 'btn-item btn-clear';
    clearBtn.innerHTML = '✖<br>外す';
    clearBtn.onclick = () => changeItem(categoryKey, '');
    gridDiv.appendChild(clearBtn);

    for (let i = 1; i <= data.count; i++) {
      const numStr = i.toString().padStart(2, '0');
      const fileName = `${data.prefix}${numStr}.png`;
      
      const btn = document.createElement('button');
      btn.className = 'btn-item';
      btn.onclick = () => changeItem(categoryKey, fileName);
      
      const img = document.createElement('img');
      img.src = fileName;
      img.className = `thumb thumb-${categoryKey}`; 
      
      btn.appendChild(img);
      gridDiv.appendChild(btn);
    }
    
    catDiv.appendChild(gridDiv);
    targetDiv.appendChild(catDiv);
  }

  function changeItem(category, fileName) {
    const imgLayer = document.getElementById(`layer-${category}`);
    if (fileName === '') {
      imgLayer.style.display = 'none';
      imgLayer.src = '';
    } else {
      imgLayer.src = fileName;
      imgLayer.style.display = 'block';
      
      if (category === 'onepiece') {
        document.getElementById('layer-top').style.display = 'none';
        document.getElementById('layer-bottom').style.display = 'none';
      } else if (category === 'top' || category === 'bottom') {
        document.getElementById('layer-onepiece').style.display = 'none';
      }
    }
  }
</script>
</body>
</html>
